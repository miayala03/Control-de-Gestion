<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DA291C">
<meta name="description" content="Plataforma interactiva de inducción para el puesto de Encargado de Stock de Cocina. Proyecto final de Control de Gestión.">
<title>Inducción · Stock de Cocina</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inducción">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#FFF9EF; --surface:#FFFFFF; --surface-2:#FFF3D6;
  --ink:#211712; --ink-soft:#5C4A3C; --steel:#9A8778; --line:#EBDFCB;
  --red:#C8102E; --red-bright:#DA291C; --yellow:#FFBC0D; --yellow-soft:#FFEFC2;
  --go:#2E7D4F; --go-soft:#E1F0E5; --warn:#DA291C; --warn-soft:#FBE2DE;
  --amber:#8A5A00;
  --shadow:0 1px 0 rgba(33,23,18,.04), 0 10px 26px -18px rgba(33,23,18,.35);
  --r:14px;
  --nav-h:66px;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input{font-family:inherit}

/* ---------------- barra superior ---------------- */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(255,249,239,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar .in{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;max-width:760px;margin:0 auto}
.logo{width:26px;height:26px;border-radius:7px;flex:none}
.tb-txt{flex:1;min-width:0}
.tb-txt strong{display:block;font-family:var(--display);font-weight:800;font-size:.95rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-txt small{display:block;font-size:.7rem;color:var(--steel);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.back{
  flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  width:34px;height:34px;border-radius:10px;font-size:1rem;cursor:pointer;display:none;
  align-items:center;justify-content:center;
}
.back.show{display:flex}

/* ---------------- layout ---------------- */
main{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.04;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--red)}
h2{font-family:var(--display);font-weight:700;font-size:1.28rem;line-height:1.15;letter-spacing:-.01em}
h3{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.2}
.kicker{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red-bright);font-weight:700}
.sub{color:var(--ink-soft);font-size:.93rem;margin-top:8px}
.sec{margin-top:30px}
.sec-head{margin-bottom:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:10px}

/* ---------------- inicio ---------------- */
.hero{padding:6px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-family:var(--mono);font-size:.68rem;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:6px 12px;color:var(--ink-soft)}
.chip b{color:var(--ink)}
.refs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.ref{background:var(--red);border-radius:12px;padding:13px 14px;color:#FFE9C7}
.ref small{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow)}
.ref strong{display:block;font-family:var(--display);font-size:1.2rem;color:#fff;margin:2px 0}
.ref span{font-size:.72rem;color:#FBD9AE}

.big-progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-top:20px}
.bp-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bp-head span{font-size:.82rem;color:var(--ink-soft);font-weight:600}
.bp-head b{font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--red)}
.track{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:100px;overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--yellow));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bp-foot{margin-top:10px;font-size:.78rem;color:var(--steel)}

.cta{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--ink);color:#FFF3D6;border:none;border-radius:var(--r);padding:16px 18px;margin-top:14px;
}
.cta .ic{font-size:1.3rem}
.cta strong{display:block;font-family:var(--display);font-size:1rem;color:#fff}
.cta small{font-size:.78rem;color:#D8C6B2}
.cta .arrow{margin-left:auto;color:var(--yellow);font-weight:700}

.riesgos{display:flex;flex-direction:column;gap:8px}
.riesgo{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid #F0C9C3;border-radius:11px;padding:11px 13px}
.riesgo .x{color:var(--warn);font-weight:700;font-family:var(--mono);font-size:.8rem;flex:none}
.riesgo p{font-size:.85rem;color:var(--ink)}
.riesgo p b{display:block;font-weight:600}
.riesgo p span{color:var(--ink-soft)}

/* ---------------- módulos ---------------- */
.mod{
  display:flex;gap:13px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;box-shadow:var(--shadow);margin-bottom:10px;transition:border-color .18s;
}
.mod:active{border-color:var(--red-bright)}
.mod .mic{
  flex:none;width:44px;height:44px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:1.25rem;
}
.mod.done .mic{background:var(--go-soft);border-color:#B6D6C2}
.mod .mtx{flex:1;min-width:0}
.mod .mtx .n{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);font-weight:700}
.mod .mtx strong{display:block;font-family:var(--display);font-size:1rem;font-weight:700}
.mod .mtx small{display:block;font-size:.79rem;color:var(--ink-soft);margin-top:2px}
.mod .mst{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:100px;white-space:nowrap}
.badge.bien{background:var(--go-soft);color:var(--go)}
.badge.medio{background:var(--yellow-soft);color:var(--amber)}
.badge.mal{background:var(--warn-soft);color:var(--warn)}
.badge.idle{background:var(--surface-2);color:var(--steel)}

/* lecciones */
.lec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.lec[open]{border-color:var(--red-bright)}
.lec summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:12px}
.lec summary::-webkit-details-marker{display:none}
.lec .num{flex:none;width:32px;height:32px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem;color:var(--red)}
.lec[open] .num{background:var(--red);color:#fff;border-color:var(--red)}
.lec .lt{flex:1;font-family:var(--display);font-weight:700;font-size:.97rem}
.lec .chev{color:var(--steel);transition:transform .25s;flex:none}
.lec[open] .chev{transform:rotate(90deg)}
.lec .body{padding:0 16px 16px}
.lec .body p{font-size:.9rem;color:var(--ink-soft);margin-bottom:12px}
.lec ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.lec ul li{font-size:.86rem;padding-left:18px;position:relative;color:var(--ink)}
.lec ul li::before{content:"";position:absolute;left:4px;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--yellow)}
.pills{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.pill{font-size:.8rem;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2)}
.pill b{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;color:var(--steel);font-weight:700;margin-bottom:2px}
.pill.ctrl{background:var(--go-soft);border-color:#B6D6C2}
.pill.ctrl b{color:var(--go)}
.pill.kpi{background:var(--warn-soft);border-color:#F0C9C3}
.pill.kpi b{color:var(--warn)}

/* ---------------- botones ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:.88rem;font-weight:600;padding:13px 18px;border-radius:11px;cursor:pointer;
  border:1.5px solid var(--red);background:var(--red);color:#fff;width:100%;
}
.btn:active{background:var(--red-bright)}
.btn.ghost{background:transparent;color:var(--red)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{width:auto;padding:10px 15px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}

/* ---------------- quiz ---------------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:11px;box-shadow:var(--shadow)}
.q .qn{font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;color:var(--red-bright);font-weight:700}
.q h3{margin:7px 0 13px;font-size:1rem}
.opt{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:.89rem;color:var(--ink);cursor:pointer}
.opt:disabled{cursor:default}
.opt.correct{background:var(--go-soft);border-color:var(--go);color:var(--go);font-weight:600}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.fb{font-size:.83rem;margin-top:9px;padding:11px 13px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--go-soft);color:var(--go)}
.fb.no{background:var(--warn-soft);color:var(--warn)}

.score{text-align:center;background:var(--red);color:#fff;border-radius:var(--r);padding:22px;margin-top:6px}
.score small{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow)}
.score .big{font-family:var(--display);font-weight:800;font-size:2.3rem;color:var(--yellow);line-height:1.1}
.score p{color:#FFE1BE;font-size:.86rem;margin-top:6px}

/* ---------------- práctica: recepción ---------------- */
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
.sim .sname{font-family:var(--display);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:9px}
.sim .rows{margin:11px 0 13px;display:flex;flex-direction:column;gap:5px}
.sim .row{display:flex;justify-content:space-between;gap:10px;font-size:.83rem;border-bottom:1px dashed var(--line);padding-bottom:4px}
.sim .row span{color:var(--steel);font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em}
.sim .row b{font-weight:600;text-align:right}
.acts{display:flex;gap:8px}
.act{flex:1;font-size:.83rem;font-weight:600;padding:11px 6px;border-radius:10px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
.act:disabled{opacity:.5;cursor:default}
.act.picked.ok{background:var(--go-soft);border-color:var(--go);color:var(--go);opacity:1}
.act.picked.no{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);opacity:1}

/* ---------------- práctica: peps ---------------- */
.peps-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.peps-item .order{flex:none;width:28px;height:28px;border-radius:8px;border:2px dashed var(--steel);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--steel);font-size:.8rem}
.peps-item.picked .order{border-style:solid;background:var(--red);border-color:var(--red);color:#fff}
.peps-item .pn{flex:1;font-weight:600;font-size:.9rem}
.peps-item .pd{font-family:var(--mono);font-size:.72rem;color:var(--warn)}
.peps-item.good{border-color:var(--go);background:var(--go-soft)}
.peps-item.bad{border-color:var(--warn);background:var(--warn-soft)}

/* ---------------- checklist ---------------- */
.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:8px;cursor:pointer;position:relative}
.check input{position:absolute;opacity:0;width:0;height:0}
.box{flex:none;width:22px;height:22px;border:2px solid var(--steel);border-radius:6px;display:grid;place-items:center;margin-top:1px}
.box svg{opacity:0;transform:scale(.5);transition:.18s}
.check input:checked ~ .box{background:var(--go);border-color:var(--go)}
.check input:checked ~ .box svg{opacity:1;transform:scale(1)}
.check .ct strong{display:block;font-size:.9rem;font-weight:600}
.check .ct small{font-size:.78rem;color:var(--steel)}
.check input:checked ~ .ct strong{color:var(--steel);text-decoration:line-through}

/* ---------------- kpi ---------------- */
.calc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);margin-bottom:10px}
.calc .et{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);font-weight:700}
.calc h3{margin:6px 0 4px;font-size:1.03rem}
.calc .hint{font-size:.8rem;color:var(--ink-soft)}
.formula{font-family:var(--mono);font-size:.74rem;background:var(--ink);color:#F3E7D6;padding:9px 11px;border-radius:8px;margin:11px 0;overflow-x:auto;white-space:nowrap}
.inputs{display:flex;flex-direction:column;gap:9px}
.inputs label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:600;color:var(--ink-soft)}
.inputs input{font-family:var(--mono);font-size:1rem;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);width:100%}
.inputs input:focus{outline:none;border-color:var(--red-bright);background:var(--surface)}
.out{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.out .val{font-family:var(--display);font-weight:800;font-size:1.6rem}

/* ---------------- avance / dashboard ---------------- */
.kpi-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.kc small{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);font-weight:700;line-height:1.3}
.kc .v{font-family:var(--display);font-weight:800;font-size:1.55rem;margin:5px 0 3px}
.kc .m{font-size:.72rem;color:var(--ink-soft)}
.estado{border-radius:var(--r);padding:18px;margin-top:14px;text-align:center}
.estado.hab{background:var(--go);color:#fff}
.estado.ref{background:var(--yellow);color:#4A3200}
.estado small{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85;display:block}
.estado strong{font-family:var(--display);font-size:1.35rem;display:block;margin:4px 0}
.estado p{font-size:.83rem;opacity:.95}
.alerta{display:flex;gap:10px;background:var(--warn-soft);border:1px solid #F0C9C3;border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:.85rem}
.alerta .i{color:var(--warn);flex:none;font-weight:700}
.tabla{width:100%;border-collapse:collapse;font-size:.84rem}
.tabla th{text-align:left;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);padding:0 0 8px;font-weight:700}
.tabla td{padding:9px 0;border-top:1px solid var(--line)}
.tabla td:last-child,.tabla th:last-child{text-align:right}

/* ---------------- nav inferior ---------------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav .in{display:flex;max-width:760px;margin:0 auto;height:var(--nav-h)}
.nav button{
  flex:1;background:none;border:none;cursor:pointer;color:var(--steel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:.66rem;font-weight:600;padding:8px 2px;
}
.nav button .ni{font-size:1.2rem;line-height:1}
.nav button.on{color:var(--red-bright)}
.nav button.on .ni{transform:translateY(-1px)}

footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--steel);font-size:.78rem}
footer b{color:var(--ink)}
.aviso{font-size:.72rem;color:var(--steel);margin-top:6px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(min-width:620px){
  .kpi-cards{grid-template-columns:repeat(4,1fr)}
  .refs{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="in">
    <button class="back" id="btnBack" aria-label="Volver">←</button>
    <img class="logo" src="iconos/icono-192.png" alt="">
    <div class="tb-txt">
      <strong id="tbTitulo">Inducción · Stock de Cocina</strong>
      <small id="tbSub">McDonald's · Cocina</small>
    </div>
  </div>
</div>

<main>
  <!-- ============ INICIO ============ -->
  <section class="view active" id="v-inicio"></section>

  <!-- ============ MÓDULOS ============ -->
  <section class="view" id="v-modulos"></section>

  <!-- ============ DETALLE DE MÓDULO ============ -->
  <section class="view" id="v-modulo"></section>

  <!-- ============ PRÁCTICA ============ -->
  <section class="view" id="v-practica"></section>

  <!-- ============ AVANCE ============ -->
  <section class="view" id="v-avance"></section>

  <footer>
    <p><b>Plataforma interactiva de inducción</b> — Encargado de Stock de Cocina.<br>
    Proyecto final · Control de Gestión · Ing. en Sistemas de Producción.</p>
    <p class="aviso" id="avisoLegal"></p>
  </footer>
</main>

<nav class="nav">
  <div class="in">
    <button data-ir="inicio" class="on"><span class="ni">🏠</span>Inicio</button>
    <button data-ir="modulos"><span class="ni">📚</span>Módulos</button>
    <button data-ir="practica"><span class="ni">🎯</span>Practicá</button>
    <button data-ir="avance"><span class="ni">📈</span>Avance</button>
  </div>
</nav>

<script src="contenido.js"></script>
<script src="app.js"></script>
</body>
</html>
