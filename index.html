<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DA291C">
<meta name="description" content="Simulador de inducción para el puesto de Encargado de Stock de Cocina. Proyecto final de Control de Gestión.">
<title>Inducción · Stock de Cocina</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png">

<!-- iPhone / iPad: iOS no usa el manifest para instalar, lee estas etiquetas.
     El ícono de 180x180 es el tamaño exacto que pide la pantalla de inicio. -->
<link rel="apple-touch-icon" sizes="180x180" href="iconos/icono-180.png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inducción">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="topbar">
  <div class="in">
    <button class="icon-btn" id="btnVolver" aria-label="Volver">←</button>
    <img class="logo" src="iconos/icono-192.png" alt="">
    <div class="tb-txt">
      <strong id="tbTitulo">Inducción · Stock de Cocina</strong>
      <small id="tbSub">McDonald's · Cocina</small>
    </div>
  </div>
</div>

<main>
  <section class="vista activa" id="v-inicio"></section>
  <section class="vista" id="v-entrenar"></section>
  <section class="vista" id="v-estacion"></section>
  <section class="vista" id="v-turno"></section>
  <section class="vista" id="v-tablero"></section>
  <section class="vista" id="v-examen"></section>
  <section class="vista" id="v-admin"></section>

  <footer>
    <p><b>Simulador de inducción</b> — Encargado de Stock de Cocina.<br>
    Proyecto final · Control de Gestión · Ing. en Sistemas de Producción.</p>
    <p class="aviso" id="avisoLegal"></p>
    <p><button class="link-sup" id="accesoSupervisor">Acceso supervisor</button></p>
  </footer>
</main>

<nav class="nav">
  <div class="in">
    <button data-ir="inicio" class="on"><span class="ni">🏠</span>Inicio</button>
    <button data-ir="entrenar"><span class="ni">🎯</span>Entrenar</button>
    <button data-ir="turno"><span class="ni">⏱️</span>Turno</button>
    <button data-ir="tablero"><span class="ni">📊</span>Tablero</button>
    <button data-ir="admin" class="oculta"><span class="ni">🗂️</span>Equipo</button>
  </div>
</nav>

<!-- ============ INSTALAR COMO APP ============ -->
<div class="inst-banner" id="instBanner">
  <div class="in">
    <img src="iconos/icono-192.png" alt="">
    <div class="tx">
      <strong>Instalala como app</strong>
      <small id="instBannerSub">Queda en tu pantalla de inicio.</small>
    </div>
    <button class="go" id="instBannerBtn">Instalar</button>
    <button class="cerrar" id="instBannerX" aria-label="Ahora no">✕</button>
  </div>
</div>

<div class="sheet" id="instSheet" role="dialog" aria-modal="true" aria-labelledby="instTitulo">
  <div class="fondo" data-cerrar-inst></div>
  <div class="caja">
    <div class="tirador"></div>
    <h3 id="instTitulo"></h3>
    <p class="sub" id="instSub"></p>
    <ol class="pasos" id="instPasos"></ol>
    <div id="instNota"></div>
    <div class="btn-row" id="instAcciones"></div>
  </div>
</div>

<script src="contenido.js"></script>
<script src="app.js"></script>
<script src="nube.js"></script>
<script src="estaciones.js"></script>
<script src="turno.js"></script>
<script src="tablero.js"></script>
<script src="admin.js"></script>
</body>
</html>
